version: '3.8'

services:
  ascp-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ascp-diagnostic-agent
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
      - HOST=0.0.0.0
      - ASCP_ENV=production
      - ASCP_SECRETS_FILE=/run/secrets/ascp_secrets.json
      # Secure operator tokens must be supplied via secrets file or externally via environment:
      - ASCP_OPERATOR_TOKENS=${ASCP_OPERATOR_TOKENS:-{}}
    volumes:
      - ./config/secrets.json:/run/secrets/ascp_secrets.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal-net

  reverse-proxy:
    image: nginx:alpine
    container_name: ascp-nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - ascp-agent
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge
