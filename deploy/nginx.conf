# ASCP Autonomous Control Plane - Nginx Reverse Proxy with TLS Termination
# Protects Python stdlib HTTP server from direct network exposure.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Rate limiting zone: max 10 requests/second per IP with burst of 20
    limit_req_zone $binary_remote_addr zone=ascp_limit:10m rate=10r/s;

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name ascp-monitor.internal;
        return 301 https://$host$request_uri;
    }

    # TLS-Terminated Secure Server
    server {
        listen 443 ssl http2;
        server_name ascp-monitor.internal;

        # TLS Certificates & Cryptographic Policy
        ssl_certificate /etc/nginx/certs/ascp_server.crt;
        ssl_certificate_key /etc/nginx/certs/ascp_server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Strict Security Headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Restrict payload sizes
        client_max_body_size 128k;

        # Proxy to internal ASCP backend daemon
        location / {
            limit_req zone=ascp_limit burst=20 nodelay;

            proxy_pass http://ascp-agent:8085;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Prometheus / Metrics scrape location
        location /api/metrics {
            # Optionally restrict metrics scraping to monitoring CIDR
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://ascp-agent:8085/api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
