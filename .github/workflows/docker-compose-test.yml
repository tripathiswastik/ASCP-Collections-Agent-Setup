name: Docker Compose Integration Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compose-live-test:
    name: Live Oracle ORA-00054 Contention Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Docker Compose Integration Suite
        run: |
          docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tester

      - name: Teardown & Clean Up Volumes
        if: always()
        run: |
          docker compose -f docker-compose.test.yml down -v
