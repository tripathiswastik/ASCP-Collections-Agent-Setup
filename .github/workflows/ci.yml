name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      oracle:
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: OraclePassword123!
          APP_USER: apps
          APP_USER_PASSWORD: AppsPassword123!
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check ascp_agent tests web scripts

      - name: Run Unit & Guardrail Test Suite
        env:
          ASCP_OPERATOR_TOKENS: '{"dev-token": "operator", "admin-token": "lead_dba"}'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/run_all_tests.py
          pytest --cov=ascp_agent tests/

      - name: Run Quantitative Evaluation Benchmark Harness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/eval_harness.py

      - name: Run Real Oracle Live Integration Test (ORA-00054 Contention)
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORACLE_TEST_HOST: localhost
          ORACLE_TEST_PORT: 1521
          ORACLE_TEST_SERVICE: FREEPDB1
          ORACLE_TEST_USER: system
          ORACLE_TEST_PASSWORD: OraclePassword123!
        run: |
          python tests/test_oracle_live_integration.py
