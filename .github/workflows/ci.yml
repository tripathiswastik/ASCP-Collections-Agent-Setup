name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit:
    name: Unit Tests & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      DISABLE_EXTERNAL_CALLS: "1"
      FORCE_SIMULATION_MODE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check ascp_agent tests web scripts

      - name: Run Unit & Guardrail Test Suite
        env:
          ASCP_OPERATOR_TOKENS: '{"dev-token": {"user": "operator", "role": "approver"}, "admin-token": {"user": "lead_dba", "role": "approver"}}'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/run_all_tests.py
          pytest --cov=ascp_agent tests/

      - name: Run Quantitative Evaluation Benchmark Harness
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python tests/eval_harness.py

  integration:
    name: Live Oracle Integration Test (Python 3.12)
    needs: unit
    runs-on: ubuntu-latest
    env:
      ORACLE_SIMULATION: "false"
      RUN_REAL_ORACLE: "true"
      ORACLE_HOST: localhost
      ORACLE_PORT: 1521
      ORACLE_SERVICE_NAME: FREEPDB1
      ORACLE_USER: system
      ORACLE_PASSWORD: OraclePassword123!
      ORACLE_TEST_HOST: localhost
      ORACLE_TEST_PORT: 1521
      ORACLE_TEST_SERVICE: FREEPDB1
      ORACLE_TEST_USER: system
      ORACLE_TEST_PASSWORD: OraclePassword123!

    services:
      oracle:
        image: gvenzl/oracle-free:slim
        env:
          ORACLE_PASSWORD: OraclePassword123!
          APP_USER: apps
          APP_USER_PASSWORD: AppsPassword123!
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest oracledb
          pip install -e .

      - name: Wait for Oracle service to be ready
        env:
          ORACLE_TEST_HOST: localhost
          ORACLE_TEST_PORT: 1521
          ORACLE_TEST_SERVICE: FREEPDB1
          ORACLE_TEST_USER: system
          ORACLE_TEST_PASSWORD: OraclePassword123!
        run: |
          echo "Waiting for Oracle on localhost:1521..."
          for i in $(seq 1 30); do
            if timeout 1 bash -c "echo > /dev/tcp/localhost/1521" 2>/dev/null; then
              echo "Oracle is accepting TCP connections"
              break
            fi
            echo "Oracle not ready yet (attempt $i/30) - sleeping 10s"
            sleep 10
          done
          if ! timeout 1 bash -c "echo > /dev/tcp/localhost/1521" 2>/dev/null; then
            echo "ERROR: Oracle did not start within expected time" >&2
            docker ps --no-trunc || true
            exit 1
          fi
          python scripts/wait_for_oracle.py

      - name: Run Real Oracle Live Integration Test (ORA-00054 Contention)
        env:
          PYTHONPATH: ${{ github.workspace }}
          ORACLE_HOST: localhost
          ORACLE_PORT: 1521
          ORACLE_SERVICE_NAME: FREEPDB1
          ORACLE_USER: system
          ORACLE_PASSWORD: OraclePassword123!
          ORACLE_TEST_HOST: localhost
          ORACLE_TEST_PORT: 1521
          ORACLE_TEST_SERVICE: FREEPDB1
          ORACLE_TEST_USER: system
          ORACLE_TEST_PASSWORD: OraclePassword123!
          RUN_REAL_ORACLE: "true"
          ORACLE_SIMULATION: "false"
        run: |
          python tests/test_oracle_live_integration.py

  docker:
    name: Docker Build & Compose Health Check
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Provision Self-Signed TLS Certificates
        run: |
          python deploy/generate_certs.py

      - name: Configure Secure Non-Placeholder Secrets
        run: |
          mkdir -p config
          python -c "
          import json, secrets
          appr_token = 'tok-appr-' + secrets.token_hex(16)
          view_token = 'tok-view-' + secrets.token_hex(16)
          data = {
              'operator_tokens': {
                  appr_token: {'user': 'ci_approver', 'role': 'approver'},
                  view_token: {'user': 'ci_viewer', 'role': 'viewer'}
              },
              'oracle': {'user': 'APPS', 'password': secrets.token_urlsafe(16), 'dsn': 'localhost:1521/FREEPDB1'},
              'servicenow': {'instance_url': 'https://ci.service-now.com', 'user': 'ci_svc', 'password': secrets.token_urlsafe(16), 'assignment_group': 'DBA_Team'}
          }
          with open('config/secrets.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          chmod 644 config/secrets.json

      - name: Build Docker Containers
        run: |
          docker compose build

      - name: Start Docker Compose Stack & Verify Health Check
        shell: bash
        run: |
          docker compose up -d
          bash scripts/wait_for_container.sh ascp-diagnostic-agent 30
          curl -fsS http://127.0.0.1:8085/health
          docker compose ps
          docker compose down
